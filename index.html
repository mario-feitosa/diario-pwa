<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário do Professor</title>
    
    <!-- Configurações do PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#012B5B">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .btn {
            background-color: #012B5B;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <img src="icon-192x192.png" alt="Logo" style="width: 150px; border-radius: 25px;">
    <h2>Diário do Professor</h2>
    <p>Aguarde o aviso para instalar o aplicativo,<br>ou acesse diretamente pelo botão abaixo:</p>
    
    <a href="https://diario.caninde.ensino.site/usuarios/logar" class="btn">Acessar o Diário</a>

    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registrado!'))
                    .catch(err => console.log('Erro no SW:', err));
            });
        }
    </script>
</body>
</html>
